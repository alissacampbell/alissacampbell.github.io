<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio 2026 - Home</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Hero fills full viewport, no scroll on home */
    body {
      overflow: hidden;
    }

    .container {
      padding: 0 80px;
      height: calc(100vh - 100px);
    }

    .hero {
      height: 100%;
      align-items: flex-end;
    }

    /* Text floats vertically centered */
    .hero-text {
      margin-top: 0;
      margin-bottom: 60px;
      align-self: center;
    }

    /* Image anchors to the bottom edge of the screen */
    .hero-image-wrapper {
      margin-top: 0;
      margin-bottom: 0;
      align-self: flex-end;
      max-width: 480px;
    }

    /* ─── Name block ─── */
    .name-block {
      position: relative;
      margin-bottom: 24px;
      line-height: 1;
    }

    /* "campbell" — large, grounded, full weight */
    .name-last {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 88px;
      font-weight: 700;
      letter-spacing: -3px;
      color: #111;
      line-height: 1;
      margin: 0;
    }

    /* "Alissa" — Rock Salt, painted over the last name */
    .name-first {
      font-family: 'Rock Salt', cursive;
      font-size: 48px;
      color: #007BFF;
      display: inline-block;
      position: relative;
      margin-top: -14px;   /* overlap down onto "campbell" */
      margin-left: -4px;   /* nudge left — intentionally off-balance */
      transform: rotate(-4deg);
      z-index: 2;
      text-shadow:
        2px 3px 0px rgba(0, 123, 255, 0.12),
        -1px -1px 0px rgba(0,0,0,0.04);
    }

    /* Responsive */
    @media (max-width: 900px) {
      body { overflow: auto; }

      .container {
        height: auto;
        padding: 20px 30px;
      }

      .hero {
        align-items: center;
      }

      .hero-text {
        margin-bottom: 0;
        align-self: auto;
      }

      .hero-image-wrapper {
        align-self: auto;
        max-width: 90%;
      }

      .name-last { font-size: 64px; }
      .name-first { font-size: 36px; margin-top: -10px; }
    }

    @media (max-width: 400px) {
      .name-last { font-size: 52px; }
      .name-first { font-size: 28px; }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <div class="logo-small">
      <a href="index.html">Portfolio 2026</a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="active">home</a>
      <a href="works.html">works</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container">
    <section class="hero">

      <div class="hero-text">
        <div class="name-block">
          <span class="name-last">campbell</span>
          <span class="name-first">Alissa</span>
        </div>
        <div class="subtitle">
          Graphic Designer <br />
          <span>Painting · Drawing</span>
        </div>
        <a href="works.html" class="cta-button">View My Work</a>
      </div>

      <div class="hero-image-wrapper">
        <img src="heroimage4.png" alt="Illustration of Alissa Campbell" class="eye-background">
        <img src="eyewhites.png" alt="Eye whites" class="eye-whites">
        <img src="eyepupils.png" alt="Pupils" class="pupil">
      </div>

    </section>
  </div>

  <script>
    const pupil = document.querySelector('.pupil');
    const eyeWhites = document.querySelector('.eye-whites');
    document.addEventListener('mousemove', (e) => {
      const rect = eyeWhites.getBoundingClientRect();
      const eyeCenterX = rect.left + rect.width / 2;
      const eyeCenterY = rect.top + rect.height / 2;
      const dx = e.clientX - eyeCenterX;
      const dy = e.clientY - eyeCenterY;
      const maxDist = 8;
      const angle = Math.atan2(dy, dx);
      const distance = Math.min(maxDist, Math.hypot(dx, dy));
      pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
    });
  </script>

</body>
</html>
