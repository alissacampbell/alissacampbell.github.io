<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio 2026 - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      height: 100%;
      /* Prevent scroll snap flash — background matches page so any overscroll is seamless */
      background-color: #fff;
      overflow: hidden;
    }

    .container {
      padding: 0 80px;
      height: calc(100vh - 100px);
    }

    .hero {
      height: 100%;
      align-items: flex-end;
      /* Pull text and image into a tighter, deliberate relationship */
      gap: 0;
    }

    /* ─── Text side ─── */
    .hero-text {
      margin-top: 0;
      margin-bottom: 60px;
      align-self: center;
      /* Shift text rightward so it overlaps the illustration's negative space */
      position: relative;
      z-index: 2;
    }

    /* ─── Name block ─── */
    .name-block {
      position: relative;
      margin-bottom: 24px;
      line-height: 1;
    }

    .name-first {
      display: inline-block;
      font-family: 'Rock Salt', cursive;
      font-size: 70px;
      color: #333;
      margin-bottom: -18px;
      margin-left: -4px;
      transform: rotate(-4deg);
      position: relative;
      z-index: 2;
    }

    .name-last {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 88px;
      font-weight: 700;
      letter-spacing: -3px;
      color: #111;
      line-height: 1;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    /* Subtle connecting line from name to illustration */
    .hero-connector {
      display: block;
      width: 2px;
      height: 40px;
      background: #ddd;
      margin: 18px 0 0 6px;
    }

    .subtitle {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
      letter-spacing: 0.04em;
      /* Indent to align with the weight of the last name */
      padding-left: 3px;
    }

    /* ─── Image side ─── */
    .hero-image-wrapper {
      position: relative;
      margin-top: 0;
      /* Bleed further below viewport — extra height means the bottom of the
         illustration extends past the screen, so the overscroll snap reveals
         more drawing rather than white space */
      margin-bottom: -120px;
      align-self: flex-end;
      max-width: 480px;
      /* Nudge image left so it breathes into the name's space intentionally */
      margin-left: -40px;
    }

    .hero-image-wrapper img {
      display: block;
      width: 100%;
    }

    .eye-whites,
    .pupil {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .container {
        height: auto;
        padding: 20px 30px;
      }
      .hero { align-items: center; }
      .hero-text { margin-bottom: 0; align-self: auto; }
      .hero-image-wrapper {
        align-self: auto;
        max-width: 90%;
        margin-bottom: -20px;
        margin-left: 0;
      }
      .name-last { font-size: 64px; }
      .name-first { font-size: 36px; margin-bottom: -12px; }
      .hero-connector { display: none; }
    }

    @media (max-width: 400px) {
      .name-last { font-size: 52px; }
      .name-first { font-size: 28px; margin-bottom: -10px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo-small">
      <a href="index.html">Portfolio 2026</a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="active">home</a>
      <a href="works.html">works</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
    </div>
  </nav>

  <div class="container">
    <section class="hero">
      <div class="hero-text">
        <div class="name-block">
          <span class="name-first">Alissa</span>
          <span class="name-last">campbell</span>
        </div>
        <span class="hero-connector"></span>
        <div class="subtitle">
          Graphic Designer &amp; Illustrator
        </div>
      </div>

      <div class="hero-image-wrapper">
        <img src="herosmaller.png" alt="Illustration of Alissa Campbell" class="eye-background">
        <img src="eyewhites.png" alt="Eye whites" class="eye-whites">
        <img src="eyepupils.png" alt="Pupils" class="pupil">
      </div>
    </section>
  </div>

  <script>
    const pupil = document.querySelector('.pupil');
    const eyeWhites = document.querySelector('.eye-whites');

    document.addEventListener('mousemove', (e) => {
      const rect = eyeWhites.getBoundingClientRect();
      const eyeCenterX = rect.left + rect.width / 2;
      const eyeCenterY = rect.top + rect.height / 2;
      const dx = e.clientX - eyeCenterX;
      const dy = e.clientY - eyeCenterY;
      const maxDist = 8;
      const angle = Math.atan2(dy, dx);
      const distance = Math.min(maxDist, Math.hypot(dx, dy));
      pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
    });
  </script>
</body>
</html>
