<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio 2026 - Contact</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    .contact-wrapper {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }
    .contact-wrapper h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .contact-wrapper p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 16px;
      color: #555;
    }
    .contact-wrapper a {
      font-size: 18px;
      color: #222;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .contact-wrapper a:hover {
      color: #555;
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      .contact-wrapper h1 {
        font-size: 28px;
      }
      .contact-wrapper p,
      .contact-wrapper a {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo-small">
      <a href="index.html">Portfolio 2026</a>
    </div>
    <div class="nav-right">
      <a href="index.html">home</a>
      <a href="works.html">works</a>
      <a href="about.html">about</a>
      <a href="contact.html" class="active">contact</a>
    </div>
  </nav>
  <div class="contact-wrapper">
    <h1>Let's Talk!</h1>
    <p>Open to remote opportunities and always happy to hear from people.</p>
    <p><a href="mailto:acampbel02@gmail.com">acampbel02@gmail.com</a></p>
  </div>
</body>
</html>
